name: Persistence safety tests

on:
  push:
    branches: [master]
    paths:
      - src/platysearch/persistence.py
      - tests/test_persistence.py
      - .github/workflows/persistence-tests.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated SQLite persistence regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_persistence.py -v